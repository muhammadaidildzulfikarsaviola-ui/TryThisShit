<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TRY CHALLENGE_</title><link rel="stylesheet" href="../style.css"><style>
.container{max-width:720px;margin:50px auto;background:#fff;border:4px solid #111;padding:30px;box-shadow:10px 10px 0 #111;transform:rotate(.7deg);text-align:center}.challenge{margin:30px 0;padding:30px;border:3px dashed #111;background:#ffccff;min-height:120px;display:flex;align-items:center;justify-content:center;font-size:1.35rem;font-weight:bold;line-height:1.3}.tag{display:inline-block;background:#00ffff;border:2px solid #111;padding:5px 9px;font-size:.75rem;font-weight:bold}
</style></head><body><div class="container"><h1>TRY CHALLENGE_</h1><p>One random task. No leaderboard. No prize. Humanity has somehow decided this is entertainment.</p><span class="tag" id="difficulty">DIFFICULTY: ???</span><div class="challenge" id="challenge">Press the button to receive your mission.</div><button id="go" class="btn-coba" type="button">[GIVE ME A CHALLENGE]</button><div style="margin-top:20px"><a href="../index.html" style="font-weight:bold;color:#111">&larr; BACK TO LAB</a></div></div><script>
const challenges=[['EASY','Drink a glass of water right now. Yes, really.'],['EASY','Send a friend one genuinely nice message with no ulterior motive. Weird concept, I know.'],['NORMAL','Put your phone face-down for 10 minutes and do literally anything else.'],['NORMAL','Write down three terrible ideas. Keep the best terrible one.'],['NORMAL','Change one tiny thing about your room and see if it improves it.'],['HARD','Open a blank page and create something in five minutes. No deleting.'],['HARD','Do the task you have been postponing for exactly seven minutes.'],['ABSURD','Give a household object a name and defend that name like it is legally binding.'],['ABSURD','Walk to another room with a completely unnecessary sense of purpose.'],['ABSURD','Invent a new law for your house. It must be enforced for exactly one hour.']];
function next(){const x=challenges[Math.floor(Math.random()*challenges.length)];document.getElementById('difficulty').textContent='DIFFICULTY: '+x[0];document.getElementById('challenge').textContent=x[1]}document.getElementById('go').addEventListener('click',next);
</script></body></html>
