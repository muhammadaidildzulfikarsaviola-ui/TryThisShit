<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TRY AI JUDGE_</title><link rel="stylesheet" href="../style.css"><style>
.container{max-width:720px;margin:50px auto;background:#fff;border:4px solid #111;padding:30px;box-shadow:10px 10px 0 #111;transform:rotate(-.8deg)}textarea{width:100%;height:150px;box-sizing:border-box;border:3px solid #111;background:#e0ffff;padding:12px;font:inherit;resize:vertical;box-shadow:4px 4px 0 #111}.result{display:none;margin-top:25px;border:3px dashed #111;padding:20px;background:#fffacd}.meter{height:20px;border:2px solid #111;background:#fff;margin:12px 0}.meter span{display:block;height:100%;width:0;background:#ff3366;transition:width .5s}
</style></head><body><div class="container"><h1>TRY AI JUDGE_</h1><p>Describe your idea. The lab will issue an opinion with tremendous confidence and absolutely no credentials.</p><textarea id="idea" maxlength="500" placeholder="I want to build a website that..."></textarea><button class="btn-coba" id="judge" type="button">[JUDGE MY IDEA]</button><div class="result" id="result"><h3 id="headline">--- JUDGMENT ---</h3><p><strong>AI Confidence:</strong> <span id="confidence"></span>%</p><div class="meter"><span id="bar"></span></div><p id="verdict"></p></div><div style="margin-top:20px;text-align:center"><a href="../index.html" style="font-weight:bold;color:#111">&larr; BACK TO LAB</a></div></div>
<script>const opinions=[['Suspiciously Good','This idea contains actual potential. Please do not ruin it with eighteen unnecessary features.'],['Chaotic Genius','Nobody knows why this might work, including you. That is promising.'],['Questionable','There is an idea in here somewhere. It is hiding very effectively.'],['Beautifully Pointless','It solves nothing. It also sounds fun. Approved.'],['Please Go Outside','Technically an idea. Emotionally, a cry for help.'],['Strong Maybe','The algorithm refuses to commit, which is the safest possible response.']];document.getElementById('judge').addEventListener('click',()=>{const idea=document.getElementById('idea').value.trim();if(!idea){alert('Give the machine an idea first. Telepathy is still in beta.');return}const n=Math.floor(Math.random()*opinions.length),c=Math.floor(62+Math.random()*39);document.getElementById('headline').textContent='--- '+opinions[n][0].toUpperCase()+' ---';document.getElementById('confidence').textContent=c;document.getElementById('bar').style.width=c+'%';document.getElementById('verdict').textContent=opinions[n][1];document.getElementById('result').style.display='block'})</script></body></html>
