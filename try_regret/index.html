<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRY REGRET_</title><link rel="stylesheet" href="../style.css"></head><body><main class="experiment"><h1>TRY REGRET_</h1><p>Enter something you did. We will manufacture the regret.</p><input id="input" placeholder="I bought another guitar..."><button class="btn-coba" id="go">[REGRET IT]</button><div id="result" class="result">REGRET ENGINE READY</div><a class="back" href="../index.html">← BACK TO LAB</a></main><script>const x=['You knew this was a bad idea. You did it anyway.','Future you is already sighing.','This will be funny in three years. Probably.','Congratulations. You have created lore.','No regret detected. Suspicious.'];go.onclick=()=>{if(!input.value.trim())return result.textContent='GIVE ME SOMETHING TO REGRET.';result.textContent=x[Math.floor(Math.random()*x.length)]};</script></body></html>
