<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRY DECISION_</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .container {
            max-width: 650px;
            margin: 50px auto;
            background: #fff;
            border: 4px solid #111;
            padding: 30px;
            box-shadow: 10px 10px 0px #111;
            transform: rotate(1deg);
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 3px solid #111;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            background: #fffacd;
            box-shadow: 3px 3px 0px #111;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .result-box {
            margin-top: 25px;
            border: 3px dashed #111;
            padding: 20px;
            background: #ffccff;
            display: none;
        }
    </style>
</head>
<body style="background-color: #e3e3dc; padding: 20px;">

    <div class="container">
        <h1>TRY DECISION_</h1>
        <p>Stuck between two choices? Let a broken algorithm make things worse for you.</p>

        <label><strong>Option A:</strong></label>
        <input type="text" id="optA" placeholder="e.g., Sleep all day">

        <label><strong>Option B:</strong></label>
        <input type="text" id="optB" placeholder="e.g., Existential crisis">

        <button id="decideBtn" class="btn-coba" style="width: 100%; background: #00ffff; color: #111; font-size: 1.1rem; padding: 12px; cursor: pointer; border: 3px solid #111; box-shadow: 4px 4px 0px #111; font-weight: bold;">[MAKE MY LIFE HARDER]</button>

        <div id="resultBox" class="result-box">
            <h3 style="margin-top:0; text-transform:uppercase;">--- DESTINY CHOSEN ---</h3>
            <p id="decisionResult" style="font-size: 1.2rem; font-weight: bold;"></p>
        </div>

        <div style="margin-top: 20px; text-align: center;">
            <a href="../index.html" style="font-weight: bold; color: #111; text-decoration: underline;">&larr; BACK TO LAB</a>
        </div>
    </div>

    <script>
        document.getElementById('decideBtn').addEventListener('click', function() {
            const a = document.getElementById('optA').value.trim();
            const b = document.getElementById('optB').value.trim();
            const resultBox = document.getElementById('resultBox');

            if(!a || !b) {
                alert("Fill both options, don't be lazy!");
                return;
            }

            const choices = [a, b, "Do neither and cry in the corner", "Procrastinate until tomorrow"];
            const selected = choices[Math.floor(Math.random() * choices.length)];

            document.getElementById('decisionResult').innerText = "The system has chosen: " + selected;
            resultBox.style.display = "block";
            resultBox.style.transform = `rotate(${Math.random() * 2 - 1}deg)`;
        });
    </script>
</body>
</html>
