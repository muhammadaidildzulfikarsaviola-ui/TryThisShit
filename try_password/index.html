<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRY PASSWORD_</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .container {
            max-width: 650px;
            margin: 50px auto;
            background: #fff;
            border: 4px solid #111;
            padding: 30px;
            box-shadow: 10px 10px 0px #111;
            transform: rotate(-0.5deg);
            text-align: center;
        }
        .pass-box {
            font-size: 1.2rem;
            margin: 25px 0;
            border: 3px solid #111;
            background: #fffacd;
            padding: 15px;
            box-shadow: 4px 4px 0px #111;
            word-break: break-all;
            font-weight: bold;
        }
    </style>
</head>
<body style="background-color: #e3e3dc; padding: 20px;">

    <div class="container">
        <h1>TRY PASSWORD_</h1>
        <p>Generate passwords so secure that even you, NASA, and the FBI will never figure them out.</p>

        <div id="passDisplay" class="pass-box">Click generate to lock yourself out forever.</div>

        <button id="passBtn" class="btn-coba" style="width: 100%; background: #ff3366; color: #fff; font-size: 1.1rem; padding: 12px; cursor: pointer; border: 3px solid #111; box-shadow: 4px 4px 0px #111; font-weight: bold;">[GENERATE UNUSABLE PASSWORD]</button>

        <div style="margin-top: 20px;">
            <a href="../index.html" style="font-weight: bold; color: #111; text-decoration: underline;">&larr; BACK TO LAB</a>
        </div>
    </div>

    <script>
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+~<>?//|\\§±";
        
        document.getElementById('passBtn').addEventListener('click', function() {
            let pass = "";
            for (let i = 0; i < 32; i++) {
                pass += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('passDisplay').innerText = pass + " (Good luck remembering this)";
        });
    </script>
</body>
</html>
