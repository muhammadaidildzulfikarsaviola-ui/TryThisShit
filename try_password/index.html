<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRY PASSWORD_</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .container { max-width: 700px; margin: 50px auto; background:#fff; border:4px solid #111; padding:30px; box-shadow:10px 10px 0 #111; transform:rotate(.5deg); text-align:center; }
        .pass-box { margin:25px 0; border:3px solid #111; background:#fffacd; padding:18px; box-shadow:4px 4px 0 #111; word-break:break-all; font-weight:bold; min-height:28px; }
        .controls { display:grid; grid-template-columns: 1fr 1fr; gap:15px; text-align:left; margin-bottom:15px; }
        label { font-size:.85rem; font-weight:bold; }
        input[type="range"] { width:100%; accent-color:#111; margin-top:8px; }
        .hint { font-size:.75rem; margin-top:10px; }
        @media(max-width:560px){.controls{grid-template-columns:1fr}}
    </style>
</head>
<body>
<div class="container">
    <h1>TRY PASSWORD_</h1>
    <p>Generate a password your future self will absolutely pretend to remember.</p>

    <div class="controls">
        <label>Length: <span id="lengthValue">24</span>
            <input id="length" type="range" min="8" max="48" value="24">
        </label>
        <label><input id="symbols" type="checkbox" checked> Include symbols</label>
    </div>

    <div id="passDisplay" class="pass-box">Click generate. Then immediately question your life choices.</div>
    <button id="passBtn" class="btn-coba" type="button">[GENERATE PASSWORD]</button>
    <button id="copyBtn" class="btn-coba" type="button" style="background:#00ffff">[COPY]</button>
    <p class="hint" id="status">Browser-generated only. Nothing is sent anywhere.</p>

    <div style="margin-top:20px"><a href="../index.html" style="font-weight:bold;color:#111">&larr; BACK TO LAB</a></div>
</div>
<script>
const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
const symbols='!@#$%^&*()_+~<>?/|';
const display=document.getElementById('passDisplay');
function generate(){
    const length=Number(document.getElementById('length').value);
    const pool=letters+(document.getElementById('symbols').checked?symbols:'');
    let pass='';
    if(window.crypto?.getRandomValues){
        const bytes=new Uint32Array(length); crypto.getRandomValues(bytes);
        for(let i=0;i<length;i++) pass+=pool[bytes[i]%pool.length];
    }else{
        for(let i=0;i<length;i++) pass+=pool[Math.floor(Math.random()*pool.length)];
    }
    display.textContent=pass;
    document.getElementById('status').textContent='Generated locally in your browser. Please use a password manager in real life, you magnificent disaster.';
}
document.getElementById('length').addEventListener('input',e=>document.getElementById('lengthValue').textContent=e.target.value);
document.getElementById('passBtn').addEventListener('click',generate);
document.getElementById('copyBtn').addEventListener('click',async()=>{if(display.textContent.includes('Click generate')) return; try{await navigator.clipboard.writeText(display.textContent);document.getElementById('status').textContent='Copied. Humanity survives another day.'}catch{document.getElementById('status').textContent='Clipboard blocked. Your browser has chosen bureaucracy.'}});
</script>
</body>
</html>
