<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRY MUSIC_</title><link rel="stylesheet" href="../style.css"></head><body><main class="experiment"><h1>TRY MUSIC_</h1><p>Make a tiny noise machine. Headphones optional. Regret included.</p><div class="music-grid"><button class="sound" data-f="110">LOW</button><button class="sound" data-f="220">MID</button><button class="sound" data-f="440">HIGH</button><button class="sound" data-f="880">WHY</button></div><button class="btn-coba" id="stop">[STOP EVERYTHING]</button><div id="result" class="result">SILENCE. FOR NOW.</div><a class="back" href="../index.html">← BACK TO LAB</a></main><script>let ctx;document.querySelectorAll('.sound').forEach(b=>b.onclick=()=>{ctx??=new AudioContext();let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=b.dataset.f;o.connect(g);g.connect(ctx.destination);g.gain.value=.04;o.start();o.stop(ctx.currentTime+.35);document.getElementById('result').textContent='YOU PRESSED '+b.textContent+' Hz. MUSICAL CAREER PENDING.'});document.getElementById('stop').onclick=()=>document.getElementById('result').textContent='STOPPED. PEACE HAS RETURNED.';</script></body></html>
