<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRY COIN_</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .container {
            max-width: 650px;
            margin: 50px auto;
            background: #fff;
            border: 4px solid #111;
            padding: 30px;
            box-shadow: 10px 10px 0px #111;
            transform: rotate(-1deg);
            text-align: center;
        }
        .coin-box {
            font-size: 3rem;
            margin: 30px 0;
            border: 3px solid #111;
            background: #fffacd;
            padding: 20px;
            box-shadow: 5px 5px 0px #111;
        }
    </style>
</head>
<body style="background-color: #e3e3dc; padding: 20px;">

    <div class="container">
        <h1>TRY COIN_</h1>
        <p>Flip a coin. Warning: The coin has a 99% chance to land on its side to annoy you.</p>

        <div id="coinDisplay" class="coin-box">🪙 READY?</div>

        <button id="flipBtn" class="btn-coba" style="width: 100%; background: #ff3366; color: #fff; font-size: 1.1rem; padding: 12px; cursor: pointer; border: 3px solid #111; box-shadow: 4px 4px 0px #111; font-weight: bold;">[FLIP THE CURSED COIN]</button>

        <div style="margin-top: 20px;">
            <a href="../index.html" style="font-weight: bold; color: #111; text-decoration: underline;">&larr; BACK TO LAB</a>
        </div>
    </div>

    <script>
        document.getElementById('flipBtn').addEventListener('click', function() {
            const display = document.getElementById('coinDisplay');
            display.innerText = "flipping...";

            setTimeout(() => {
                const outcomes = ["HEADS!", "TAILS!", "LANDED ON ITS SIDE! (You lose)", "LOST IN THEVOID!"];
                const chosen = outcomes[Math.floor(Math.random() * outcomes.length)];
                display.innerText = chosen;
            }, 500);
        });
    </script>
</body>
</html>
