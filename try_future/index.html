<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRY FUTURE_</title><link rel="stylesheet" href="../style.css"></head><body><main class="experiment"><h1>TRY FUTURE_</h1><p>Ask the future anything. The future has absolutely no idea.</p><input id="q" placeholder="Will I become rich?"><button class="btn-coba" id="go">[ASK THE FUTURE]</button><div id="result" class="result">FUTURE CONNECTION PENDING</div><a class="back" href="../index.html">← BACK TO LAB</a></main><script>const a=['Probably.','Not even remotely.','Ask again after lunch.','The timeline is buffering.','Yes, but not in the way you expect.','The future refuses to comment.','Error 302: destiny temporarily relocated.'];go.onclick=()=>{if(!q.value.trim())return result.textContent='ASK SOMETHING FIRST.';result.textContent=a[Math.floor(Math.random()*a.length)]};</script></body></html>
