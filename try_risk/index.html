<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRY RISK_</title><link rel="stylesheet" href="../style.css"></head><body><main class="experiment"><h1>TRY RISK_</h1><p>Tell the machine what you are considering. It will judge your risk with zero credentials.</p><input id="input" placeholder="e.g. quit my job tomorrow"><button class="btn-coba" id="go">[CALCULATE RISK]</button><div id="result" class="result">RISK ENGINE IDLE</div><a class="back" href="../index.html">← BACK TO LAB</a></main><script>const x=['LOW RISK. BORING, BUT RESPONSIBLE.','MEDIUM RISK. PROCEED WITH SNACKS.','HIGH RISK. MAYBE TELL SOMEONE FIRST.','ABSURD RISK. THE LAB ACCEPTS NO LIABILITY.','RISK UNKNOWN. EVEN THE MACHINE IS CONCERNED.'];go.onclick=()=>{if(!input.value.trim())return result.textContent='ENTER A DECISION FIRST.';result.textContent=x[Math.floor(Math.random()*x.length)]};</script></body></html>
