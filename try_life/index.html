<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TRY LIFE_</title><link rel="stylesheet" href="../style.css"><style>
.container{max-width:720px;margin:50px auto;background:#fff;border:4px solid #111;padding:30px;box-shadow:10px 10px 0 #111;transform:rotate(-.6deg)}input{width:100%;box-sizing:border-box;padding:13px;border:3px solid #111;background:#fffacd;font:inherit;box-shadow:3px 3px 0 #111;margin:8px 0 16px}.result{display:none;margin-top:25px;padding:24px;background:#e0ffff;border:3px dashed #111}.api-line{font-size:.78rem;font-weight:bold;margin-bottom:10px}
</style></head><body><div class="container"><h1>TRY LIFE_</h1><p>Ask a question as if life exposes an API. The response is not guaranteed to be useful, accurate, or remotely qualified.</p><label><strong>Question</strong></label><input id="q" maxlength="160" placeholder="Should I text them back?"><button id="ask" class="btn-coba" type="button">[CALL LIFE API]</button><div class="result" id="result"><div class="api-line">200 OK // LIFE/1.0</div><h3 id="answer"></h3><p id="detail"></p></div><div style="margin-top:20px;text-align:center"><a href="../index.html" style="font-weight:bold;color:#111">&larr; BACK TO LAB</a></div></div><script>
const answers=[['Probably.','Do the thing, but lower your expectations by 37%.'],['Not today.','The universe has scheduled this request for later and forgot to send the calendar invite.'],['Absolutely.','You already knew the answer. You just wanted a machine to take responsibility.'],['No.','Sometimes the most advanced API response is simply: don\'t.'],['It depends.','Classic human problem. Insufficient context, excessive confidence.'],['Ask again tomorrow.','Future You has slightly better documentation.']];document.getElementById('ask').addEventListener('click',()=>{const q=document.getElementById('q').value.trim();if(!q){alert('Send a question. The API is not paid enough to guess it.');return}const a=answers[Math.floor(Math.random()*answers.length)];document.getElementById('answer').textContent=a[0];document.getElementById('detail').textContent=a[1];document.getElementById('result').style.display='block'})</script></body></html>
