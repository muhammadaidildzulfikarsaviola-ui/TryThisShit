<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRY BUTTON_</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .container {
            max-width: 700px;
            margin: 40px auto;
            background: #fff;
            border: 4px solid #111;
            padding: 30px;
            box-shadow: 10px 10px 0px #111;
            transform: rotate(-0.5deg);
            text-align: center;
        }
        .play-area {
            position: relative;
            width: 100%;
            height: 320px;
            border: 3px dashed #111;
            background: #fffacd;
            margin: 20px 0;
            overflow: hidden;
        }
        #movingBtn {
            position: absolute;
            background: #ff3366;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            font-weight: bold;
            padding: 10px 20px;
            border: 3px solid #111;
            box-shadow: 4px 4px 0px #111;
            cursor: pointer;
            transition: background 0.1s;
        }
        #movingBtn:hover {
            background: #00ffff;
            color: #111;
        }
        .msg-box {
            border: 3px solid #111;
            background: #e0ffff;
            padding: 15px;
            font-weight: bold;
            min-height: 50px;
            margin-top: 15px;
            font-size: 1.05rem;
        }
    </style>
</head>
<body style="background-color: #e3e3dc; padding: 20px;">

    <div class="container">
        <h1>TRY BUTTON_</h1>
        <p>Chase down this absolute menace of a button and click it 10 times before your sanity completely shatters.</p>

        <div class="play-area" id="playArea">
            <button id="movingBtn">CLICK ME!</button>
        </div>

        <div class="msg-box" id="msgDisplay">
            System on standby. Go ahead, chase the button if your fingers aren't too fragile.
        </div>

        <div style="margin-top: 20px;">
            <a href="../index.html" style="font-weight: bold; color: #111; text-decoration: underline;">&larr; BACK TO LAB</a>
        </div>
    </div>

    <script>
        const ramblingMessages = [
            "Click 1: Why did you click? Seriously, do you have nothing better to do?",
            "Click 2: This button is protected by high-level hallucination laws.",
            "Click 3: Hey, didn't you sprain your finger? Go grab some coffee instead.",
            "Click 4: In another dimension, this button is clicking your phone screen back.",
            "Click 5: Halfway there, bro! But your life is still completely directionless.",
            "Click 6: Careful, your cursor is about to pierce through the back of your monitor.",
            "Click 7: Legend says whoever clicks 10 times gets a soulmate... but it's a total lie.",
            "Click 8: Almost done, get ready to mentally accept that you wasted your time for nothing.",
            "Click 9: I swear this button is exhausted from running after a bored potato like you.",
            "Click 10: THE END! Congrats, you've successfully wasted your precious time for absolutely zero payoff!"
        ];

        let clickCount = 0;
        const btn = document.getElementById('movingBtn');
        const area = document.getElementById('playArea');
        const display = document.getElementById('msgDisplay');

        // Initial position in the center
        btn.style.top = "130px";
        btn.style.left = "280px";

        btn.addEventListener('click', function() {
            if (clickCount >= 10) {
                display.innerText = "It's already 10 times! I told you it's the end, yet you keep going. You really have too much free time.";
                return;
            }

            // Display sequential rambling message
            display.innerText = ramblingMessages[clickCount];
            clickCount++;

            // Move button randomly inside the play area
            const maxX = area.clientWidth - btn.offsetWidth - 20;
            const maxY = area.clientHeight - btn.offsetHeight - 20;
            
            const randomX = Math.floor(Math.random() * Math.max(10, maxX));
            const randomY = Math.floor(Math.random() * Math.max(10, maxY));

            btn.style.left = randomX + "px";
            btn.style.top = randomY + "px";
        });
    </script>
</body>
</html>
