<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRY EMOTION_</title><link rel="stylesheet" href="../style.css"></head><body><main class="experiment"><h1>TRY EMOTION_</h1><p>Describe your current state. The lab will pretend it understands.</p><textarea id="input" placeholder="I feel..." rows="5"></textarea><button class="btn-coba" id="go">[ANALYZE ME]</button><div id="result" class="result">EMOTION SENSOR OFFLINE</div><a class="back" href="../index.html">← BACK TO LAB</a></main><script>const r=[['low-power human','You sound like you need food, water, or a nap. Possibly all three.'],['mild chaos','Emotion detected. Scientific terminology: yikes.'],['suspiciously fine','You claim to be okay. The lab remains unconvinced.'],['maximum overthinking','Your brain has opened 46 tabs and none are useful.'],['surprisingly hopeful','Against all available evidence, optimism detected.']];go.onclick=()=>{if(!input.value.trim())return result.textContent='PLEASE ENTER SOMETHING.';let x=r[Math.floor(Math.random()*r.length)];result.innerHTML='<strong>'+x[0].toUpperCase()+'</strong><br>'+x[1]};</script></body></html>
