<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRY CAT OR MUFFIN_</title><link rel="stylesheet" href="../style.css"></head><body><main class="experiment"><h1>TRY CAT OR MUFFIN_</h1><p>One emoji. One guess. Humanity has survived worse.</p><div id="pic" class="emoji">🐱</div><div class="choices"><button class="btn-coba" data-x="cat">[CAT]</button><button class="btn-coba" data-x="muffin">[MUFFIN]</button></div><div id="result" class="result">MAKE YOUR GUESS</div><a class="back" href="../index.html">← BACK TO LAB</a></main><script>const rounds=[['🐱','cat'],['🧁','muffin'],['🐈','cat'],['🧁','muffin'],['😺','cat'],['🧁','muffin']];let r=rounds[Math.floor(Math.random()*rounds.length)];document.getElementById('pic').textContent=r[0];document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>document.getElementById('result').textContent=b.dataset.x===r[1]?'CORRECT. YOU HAVE EYES.':'WRONG. IT WAS '+r[1].toUpperCase()+'.');</script></body></html>
