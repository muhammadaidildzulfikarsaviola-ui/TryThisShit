<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRY COLOR_</title><link rel="stylesheet" href="../style.css"></head><body><main class="experiment"><h1>TRY COLOR_</h1><p>Generate a color. Give it a name. Pretend this was important.</p><div id="swatch" class="swatch"></div><div id="hex">#------</div><h2 id="name">COLOR NOT FOUND</h2><button class="btn-coba" id="go">[GENERATE COLOR]</button><a class="back" href="../index.html">← BACK TO LAB</a></main><script>const names=['Suspicious Tomato','Office Fluorescent','Wet Concrete','Expired Mint','Accidental Purple','Monday Blue','Unnecessary Orange','Browser Tab Green'];document.getElementById('go').onclick=()=>{let h='#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');document.getElementById('swatch').style.background=h;document.getElementById('hex').textContent=h;document.getElementById('name').textContent=names[Math.floor(Math.random()*names.length)]};</script></body></html>
