<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRY PRODUCTIVITY_</title><link rel="stylesheet" href="../style.css"></head><body><main class="experiment"><h1>TRY PRODUCTIVITY_</h1><p>A productivity tool that may accidentally become procrastination.</p><div id="timer" class="timer">05:00</div><button class="btn-coba" id="start">[START]</button><button class="btn-coba" id="reset">[RESET]</button><div id="result" class="result">Your task is simply: do the thing.</div><a class="back" href="../index.html">← BACK TO LAB</a></main><script>let t=300,id;const out=document.getElementById('timer');function render(){out.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}document.getElementById('start').onclick=()=>{clearInterval(id);id=setInterval(()=>{if(t<=0){clearInterval(id);document.getElementById('result').textContent='DONE. YOU SURVIVED FIVE MINUTES.';return}t--;render()},1000);document.getElementById('result').textContent='GO. NO NEW TABS.'};document.getElementById('reset').onclick=()=>{clearInterval(id);t=300;render();document.getElementById('result').textContent='Reset. Naturally.'};</script></body></html>
