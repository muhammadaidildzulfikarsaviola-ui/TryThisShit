<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRY PICKUP LINE_</title><link rel="stylesheet" href="../style.css"></head><body><main class="experiment"><h1>TRY PICKUP LINE_</h1><p>Generate a pickup line with scientifically questionable confidence.</p><input id="word" placeholder="one word, e.g. coffee"><button class="btn-coba" id="go">[GENERATE]</button><div id="result" class="result">INPUT REQUIRED</div><a class="back" href="../index.html">← BACK TO LAB</a></main><script>const forms=['Are you {x}? Because I suddenly forgot every other word.','I would make a joke about {x}, but your smile already won.','You + {x} = the only equation I am willing to fail.','I blame {x} for making you look this distracting.'];go.onclick=()=>{let x=word.value.trim()||'coffee';result.textContent=forms[Math.floor(Math.random()*forms.length)].replace('{x}',x)};</script></body></html>
